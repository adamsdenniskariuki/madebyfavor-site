  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    (function () {
      var d = document.documentElement, m = "system", t = "ink";
      try { m = localStorage.getItem("mbf-mode") || m; t = localStorage.getItem("mbf-theme") || t; } catch (e) {}
      if (["system", "light", "dark"].indexOf(m) < 0) m = "system";
      if (["ink", "forest", "ember"].indexOf(t) < 0) t = "ink";
      d.dataset.mode = m;
      d.dataset.theme = t;
      d.dataset.scheme = m === "dark" || (m === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
    })();
  </script>
  <link rel="stylesheet" href="/src/styles.css">
</head>
